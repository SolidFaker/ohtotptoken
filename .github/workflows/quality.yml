name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      # dev push = PR merge commits. PR-tip checks cannot see semantic merge
      # conflicts between separately-green PRs (e.g. ed5e53e: #196 still
      # referenced MaterialSurface that #197 had deleted), so the trunk
      # itself must be gated too.
      - dev
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-regression:
    name: Node offline checks
    # No SDK or npm install is required. Import regressions use the production
    # JSZip core from an integrity-checked, lockfile-pinned OHPM HAR; the other
    # suites use Node builtins and SDK-boundary fakes.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check string resources
        run: node scripts/check-string-keys.mjs
        shell: bash

      - name: Cross-check Steam field numbers
        run: node scripts/verify-steam-field-numbers.mjs
        shell: bash

      - name: Check cloud backup diagnostic privacy
        run: node scripts/check-cloud-backup-diagnostic-privacy.mjs
        shell: bash

      - name: Prepare integrity-checked production JSZip core
        run: node scripts/prepare-icon-pack-jszip.mjs --github-env
        shell: bash

      # Includes collector limits/synthetic leak sentinels and privacy-gate regressions.
      # Device collection is never run in CI and no raw hilog is uploaded as an artifact.
      - name: Run node regression suites
        run: node --test "scripts/*.test.mjs"
        shell: bash

  localunit:
    name: ArkTS unit tests (LocalUnit)
    # macOS ARM runner: LocalUnit executes tests inside the SDK Previewer
    # runtime, which only ships in the Windows/macOS command-line-tools
    # packages - on Linux, hvigorw test hangs after compiling (verified in
    # run 33878317600). macOS is preferred over Windows here: the mac-arm64
    # runner has 3 vCPUs and APFS, so restoring the ~5 GB SDK cache from
    # actions/cache takes ~1-2 min instead of ~4 min on 2-vCPU Windows+NTFS.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@v2
        with:
          # v2 does gh release download <version> and does not resolve
          # "latest"; a concrete tag from ErBWs/ohos-sdk releases is required.
          version: 26.0.0.821
          cache: true

      - name: Install project dependencies
        run: ohpm install --all --rt 5 --ri 5000
        shell: bash

      # hvigorw test exits 0 even when assertions fail, so the gate is
      # enforced by parsing the result file produced by GenerateUnitTestResult.
      - name: Run LocalUnit tests
        run: hvigorw test -p module=entry@default --no-daemon
        shell: bash

      - name: Check test results
        shell: bash
        run: |
          RESULT_FILE=$(find . -name test_result.txt -path "*test*" | head -n 1)
          if [ -z "$RESULT_FILE" ]; then
            echo "::error::test_result.txt not found - LocalUnit produced no results"
            exit 1
          fi
          echo "Result file: $RESULT_FILE"
          cat "$RESULT_FILE"
          SUMMARY=$(grep '^Tests run:' "$RESULT_FILE" | tail -n 1)
          FAILURES=$(echo "$SUMMARY" | sed -E 's/.*Failure: ([0-9]+).*/\1/')
          ERRORS=$(echo "$SUMMARY" | sed -E 's/.*Error: ([0-9]+).*/\1/')
          if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
            echo "::error::LocalUnit tests failed - $SUMMARY"
            exit 1
          fi
          echo "All LocalUnit tests passed - $SUMMARY"

      # hvigorw test regenerates coverageReport.json alongside test_result.txt.
      # Gate: logic-layer (common + entry crypto/steam/oath/utils, device-only
      # files excluded per docs/TEST_PLAN.md) line & branch coverage must not
      # regress against scripts/coverage-baseline.json.
      - name: Check logic-layer coverage regression
        run: node scripts/check-coverage.mjs
        shell: bash

  build:
    name: Build HAP (all modules)
    # LocalUnit only compiles entry for test purposes; the wearable HAP and
    # the release build path (obfuscation, resource packaging) are otherwise
    # never verified before main. Runs on the same macOS image as localunit
    # so both jobs share one setup-ohos SDK cache (actions/cache is keyed
    # per runner OS); the macOS runner needs no extra system packages.
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@v2
        with:
          # Keep the SDK version in sync with the localunit job.
          version: 26.0.0.821
          cache: true

      - name: Install project dependencies
        run: ohpm install --all --rt 5 --ri 5000
        shell: bash

      # Same release-mode unsigned path as the shipping build.yaml, so a
      # PR that only breaks release packaging (not debug/LocalUnit) is
      # still caught before merge.
      - name: Build HAPs (default product, release, unsigned)
        run: hvigorw assembleHap -p buildMode=release --config properties.ignoreSignHap=true --no-daemon
        shell: bash

      - name: Verify build artifacts
        shell: bash
        run: |
          FAIL=0
          for MODULE in entry wearable; do
            HAP=$(find "${MODULE}/build" -name "*.hap" -type f 2>/dev/null | head -n 1)
            if [ -z "$HAP" ]; then
              echo "::error::No hap found for module ${MODULE}"
              FAIL=1
            else
              echo "Module ${MODULE}: $(basename "$HAP")"
            fi
          done
          exit $FAIL
